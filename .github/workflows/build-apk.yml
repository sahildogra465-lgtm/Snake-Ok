name: Build Snake LIVE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o SnakeLiveAPKProject.zip -d snake-project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Build APK
        working-directory: snake-project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SnakeLive-debug-apk
          path: snake-project/app/build/outputs/apk/debug/app-debug.apk
