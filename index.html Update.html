<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake Live</title>
<style>
:root{--blue:#1565ff;--green:#14a44d;--bg:#ffffff;--ink:#111;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:900}
.app{height:100%;max-width:520px;margin:0 auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.head{display:flex;gap:10px;align-items:stretch}
.info{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
#lvl{font-size:30px;color:var(--blue);letter-spacing:1px}
.rw{font-size:15px;color:var(--green);line-height:1.25}
.rw b{color:var(--blue)}
.clip{width:34%;aspect-ratio:9/12;border:4px solid var(--blue);border-radius:8px;overflow:hidden;position:relative;background:#000;flex:none}
.clip video{width:100%;height:100%;object-fit:cover}
.clip i{position:absolute;left:4px;top:3px;color:#fff;font-size:11px;font-style:normal;background:#e11;padding:1px 5px;border-radius:4px}
.bar{border:3px solid var(--blue);border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;font-size:20px;color:var(--green)}
.bar span:first-child{color:var(--blue)}
#boxwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#box{position:relative;width:300px;height:300px;border:8px solid #000;border-radius:6px;background:#12172b}
canvas{width:100%;height:100%;display:block}
#pop{position:absolute;left:0;right:0;top:6px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.p{background:#fff;color:var(--green);border:3px solid var(--blue);border-radius:10px;padding:4px 12px;font-size:18px;animation:in .3s}
@keyframes in{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
#flash{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:34px;color:#fff;background:rgba(0,0,0,.55);text-align:center}
.foot{display:flex;justify-content:space-between;align-items:center}
#ban{font-size:34px;color:#e11}
.t button{font-weight:900;border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:8px;padding:6px 8px;font-size:14px}
#start{position:fixed;inset:0;background:rgba(255,255,255,.96);display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--blue);z-index:9;text-align:center;cursor:pointer}
body.mv .mvable{outline:3px dashed #e0f;touch-action:none;cursor:move;position:relative;z-index:5}
.mvable{will-change:transform}#rl{display:none}body.mv #rl{display:inline-block}
#lvl{font-style:italic;letter-spacing:3px;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:linear-gradient(90deg,var(--blue),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.22))}
.rw{font-style:italic;letter-spacing:.6px;text-shadow:1px 1px 0 rgba(0,0,0,.18)}
.bar{box-shadow:3px 3px 0 rgba(0,0,0,.18);letter-spacing:1px;font-style:italic}
#ban{font-style:italic;letter-spacing:2px;text-shadow:2px 2px 0 #ffc2c2,4px 4px 0 rgba(0,0,0,.15)}
.p{font-style:italic;box-shadow:3px 3px 0 rgba(0,0,0,.2)}
#ban{line-height:.95;text-align:right}
</style>
</head>
<body>
<div id="start">▶ Tap karo<br>Game start</div>
<div class="app">
 <div class="head">
  <div class="info">
   <div id="lvl">LEVEL = 0</div>
   <div class="rw">👍 <b>1 LIKE</b> +5🍎</div>
   <div class="rw">💬 <b>1 COMMENT</b> +1🍎</div>
   <div class="rw">🔔 <b>1 SUBSCRIBE</b> = Snake colour change</div>
  </div>
  <div class="clip"><video src="clip.mp4" autoplay loop muted playsinline></video><i>LIVE</i></div>
 </div>
 <div class="bar"><span>👍 LIKES</span><span id="lk">0/100</span><span>+50🍎</span></div>
 <div id="boxwrap"><div id="box"><canvas id="c" width="500" height="500"></canvas><div id="pop"></div><div id="flash"></div></div></div>
 <div class="foot"><div class="t"><button id="rs">↺ Restart</button> <button id="ts">🔔</button> <button id="mvb">✋ Move</button> <button id="rl">⟲</button> <button id="cb">🎨</button></div><div id="ban">67=<br>Ban</div></div>
</div>
<script src="config.js"></script>
<audio id="song" src="song.mp3" loop></audio>
<script>
const N=20,S=20,ctx=document.getElementById('c').getContext('2d');
const COLORS=['#8b5a2b','#ffb6c8','#90ee90'];
let ci=0,level=0,snake,dir,apples=[],likes=0,step=87,fast=false,paused=false,AC=null;
const $=id=>document.getElementById(id);

// keyboard key sound (clack): noise burst + low thump, key-down then softer key-up
let NB=null,MG=null;
function hit(t,v){const b=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),o=AC.createOscillator(),g2=AC.createGain();
 b.buffer=NB;f.type='highpass';f.frequency.value=1800+Math.random()*1200;f.Q.value=.7;
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.035);
 b.connect(f);f.connect(g);g.connect(MG);b.start(t);b.stop(t+.05);
 o.type='sine';o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(90,t+.04);
 g2.gain.setValueAtTime(v*.8,t);g2.gain.exponentialRampToValueAtTime(.001,t+.05);
 o.connect(g2);g2.connect(MG);o.start(t);o.stop(t+.06)}
function click(){if(!AC)return;if(!MG){MG=AC.createGain();MG.gain.value=3;const cp=AC.createDynamicsCompressor();MG.connect(cp);cp.connect(AC.destination)}if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.06,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 const t=AC.currentTime;hit(t,1);hit(t+.06,.45)}

const inb=(x,y)=>x>=0&&y>=0&&x<N&&y<N;
const occ=(x,y)=>snake.some(s=>s.x===x&&s.y===y);
const D=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
function addApples(n,g){for(let k=0;k<n;k++){for(let i=0;i<300;i++){const x=Math.random()*N|0,y=Math.random()*N|0;
 if(!occ(x,y)&&!apples.some(a=>a.x===x&&a.y===y)){apples.push({x,y,g:!!g});break}}}}
function newLevel(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};apples=[];addApples(200,true);addApples(5);$('lvl').textContent='LEVEL = '+level}

function bfsPath(from,goal,blocked){const k=(x,y)=>x*100+y,prev=new Map([[k(from.x,from.y),null]]),q=[from];
 while(q.length){const p=q.shift();
  if(p!==from&&goal(p)){const path=[];let c=p;while(c!==from){path.unshift(c);c=prev.get(k(c.x,c.y))}return path}
  for(const d of D){const n={x:p.x+d.x,y:p.y+d.y},kk=k(n.x,n.y);if(inb(n.x,n.y)&&!prev.has(kk)&&!blocked.has(kk)){prev.set(kk,p);q.push(n)}}}
 return null}
function room(x,y){const seen=new Set([x*100+y]),q=[{x,y}];let n=0;
 while(q.length&&n<200){const p=q.shift();n++;for(const d of D){const a=p.x+d.x,b=p.y+d.y;if(inb(a,b)&&!occ(a,b)&&!seen.has(a*100+b)){seen.add(a*100+b);q.push({x:a,y:b})}}}return n}
function think(){
 const h=snake[0],tail=snake[snake.length-1],blk=new Set(snake.slice(0,-1).map(s=>s.x*100+s.y));
 const ap=new Set(apples.map(a=>a.x*100+a.y)),isT=p=>p.x===tail.x&&p.y===tail.y;
 let d=null;fast=false;
 const path=bfsPath(h,p=>ap.has(p.x*100+p.y),blk);
 if(path){const e=path[path.length-1],t=apples.find(a=>a.x===e.x&&a.y===e.y);fast=!!(t&&t.g)}
 if(path){
  const s=snake.slice();path.forEach((c,i)=>{s.unshift(c);if(i<path.length-1)s.pop()});
  const t=s[s.length-1],b2=new Set(s.slice(0,-1).map(q=>q.x*100+q.y));
  if(bfsPath(s[0],q=>q.x===t.x&&q.y===t.y,b2))d={x:path[0].x-h.x,y:path[0].y-h.y};
 }
 if(!d){let bd=-1;
  for(const m of D){const x=h.x+m.x,y=h.y+m.y;if(!inb(x,y)||blk.has(x*100+y))continue;
   let sc=-1;if(isT({x,y}))sc=0;else{const pp=bfsPath({x,y},isT,blk);if(pp)sc=pp.length}
   if(sc>bd){bd=sc;d=m}}}
 if(!d){let br=-1;for(const m of D){const x=h.x+m.x,y=h.y+m.y;if(inb(x,y)&&!occ(x,y)){const r=room(x,y);if(r>br){br=r;d=m}}}}
 if(!d)return false;
 if(d.x!==dir.x||d.y!==dir.y)click();dir=d;return true}

function tick(){
 if(paused)return;
 if(!think()){levelDone();return}
 const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 snake.unshift(h);
 const i=apples.findIndex(a=>a.x===h.x&&a.y===h.y);
 if(i>=0){const a=apples[i];apples.splice(i,1);if(!a.g){const want=snake.length<0.85*N*N?5:1;if(apples.filter(q=>!q.g).length<want)addApples(1)}}else snake.pop();
}
function levelDone(){paused=true;const f=$('flash');f.style.display='flex';f.innerHTML='LEVEL '+level+' COMPLETE 🎉<br>Next level...';
 setTimeout(()=>{level=Math.min(level+1,999);newLevel();f.style.display='none';paused=false},2000)}

function draw(){const c=25;ctx.clearRect(0,0,500,500);
 ctx.font='22px serif';ctx.textBaseline='middle';ctx.textAlign='center';
 for(const a of apples)ctx.fillText(a.g?'🍏':'🍎',a.x*c+c/2,a.y*c+c/2+1);
 const P=s=>[s.x*c+c/2,s.y*c+c/2];
 ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=COLORS[ci];ctx.lineWidth=22;
 ctx.beginPath();snake.forEach((s,i)=>{const[X,Y]=P(s);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.stroke();
 ctx.fillStyle='rgba(0,0,0,.3)';
 snake.forEach((s,i)=>{if(!i)return;const[X,Y]=P(s);ctx.beginPath();ctx.arc(X-4,Y-3,2.3,0,6.3);ctx.arc(X+4,Y+3,2.3,0,6.3);ctx.fill()});
 const[hx,hy]=P(snake[0]),px=-dir.y,py=dir.x;
 for(const sg of[-1,1]){const ex=hx+dir.x*3+px*5.5*sg,ey=hy+dir.y*3+py*5.5*sg;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,5.8,0,6.3);ctx.fill();ctx.fillStyle='#ff9a1f';ctx.beginPath();ctx.arc(ex,ey,5.2,0,6.3);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(ex+dir.x*1.5,ey+dir.y*1.5,2.6,0,6.3);ctx.fill()}
 requestAnimationFrame(draw)}

function popup(t){const d=document.createElement('div');d.className='p';d.textContent=t;$('pop').appendChild(d);setTimeout(()=>d.remove(),3500);while($('pop').children.length>3)$('pop').firstChild.remove()}
function setLikes(){$('lk').textContent=likes+'/'+((Math.floor(likes/100)+1)*100)}
// Live events: window.liveEvent('like'|'comment'|'subscribe', name, text)
window.liveEvent=function(type,name){
 if(type==='like'){likes++;addApples(5);if(likes%100===0){addApples(50,true);popup('🎉 '+likes+' likes! +50🍎')}setLikes()}
 else if(type==='comment'){addApples(1)}
 else if(type==='subscribe'){ci=(ci+1)%COLORS.length;popup('@'+(name||'viewer')+' subscribe 🔔')}};
$('rs').onclick=()=>{level=0;paused=false;$('flash').style.display='none';newLevel()};$('ts').onclick=()=>liveEvent('subscribe','sahil');

$('start').onclick=()=>{$('start').style.display='none';AC=new (window.AudioContext||window.webkitAudioContext)();
 const s=$('song');s.volume=.15;s.play().catch(()=>{});document.querySelector('video').play().catch(()=>{})};
function fit(){const w=$("boxwrap"),z=Math.min(w.clientWidth,w.clientHeight);$("box").style.width=z+"px";$("box").style.height=z+"px"}
window.addEventListener("resize",fit);window.addEventListener("load",fit);fit();
// Move mode: text, video, likes bar, 67=Ban ko drag karke kahin bhi rakho
const MV=['.info','.clip','.bar','#ban'];let pos={};
try{pos=JSON.parse(localStorage.getItem('pos')||'{}')}catch(e){}
const put=(el,k)=>{const q=pos[k]||{x:0,y:0};el.style.transform='translate('+q.x+'px,'+q.y+'px)'};
MV.forEach(k=>{const el=document.querySelector(k);el.classList.add('mvable');put(el,k);
 let sx,sy,ox,oy,on=false;
 el.addEventListener('pointerdown',e=>{if(!document.body.classList.contains('mv'))return;on=true;const q=pos[k]||{x:0,y:0};sx=e.clientX;sy=e.clientY;ox=q.x;oy=q.y;el.setPointerCapture(e.pointerId);e.preventDefault()});
 el.addEventListener('pointermove',e=>{if(!on)return;pos[k]={x:ox+e.clientX-sx,y:oy+e.clientY-sy};put(el,k)});
 const end=()=>{if(!on)return;on=false;try{localStorage.setItem('pos',JSON.stringify(pos))}catch(e){}};
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)});
$('mvb').onclick=()=>{const m=document.body.classList.toggle('mv');$('mvb').textContent=m?'✔ Done':'✋ Move'};
$('rl').onclick=()=>{pos={};try{localStorage.removeItem('pos')}catch(e){}MV.forEach(k=>put(document.querySelector(k),k))};
// Text colour change: har tap par naya colour set
const PAL=[['#111111','#111111'],['#1565ff','#1565ff'],['#f2c200','#f2c200'],['#ff4fa3','#ff4fa3'],['#ff6b6b','#ff6b6b']];
let pi=-1;try{const v=localStorage.getItem('pal');pi=v===null?-1:+v}catch(e){}
const setPal=()=>{const c=PAL[pi%PAL.length],r=document.documentElement.style;r.setProperty('--blue',c[0]);r.setProperty('--green',c[1])};
if(pi>=0)setPal();$('cb').onclick=()=>{pi=(pi+1)%PAL.length;setPal();try{localStorage.setItem('pal',pi)}catch(e){}};
newLevel();draw();
(function loop(){tick();setTimeout(loop,(fast||snake.length<0.85*N*N)?58:step)})();
</script>
<script src="yt.js"></script>
</body>
</html>
